server:
  port: 9030
  servlet.context-path: /intelligence

spring:
  datasource:
    url: jdbc:postgresql://localhost:9010/lovable_intelligence_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-3.8-flash
          temperature: 0.0
          thinking-level: LOW

---
spring:
  config:
    activate:
      on-profile: k8s
  datasource:
    url: jdbc:postgresql://pgvector.lovable-core.svc.cluster.local:5432/intelligence_db
    username: intelligence_user
    password: ${DB_PASSWORD}

ai:
  openai:
    api-key: ${AI_API_KEY}
  chat:
    options:
      model: google/gemini-3-flash-preview
